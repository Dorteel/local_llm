[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llms"
version = "0.1.0"
description = "Transparent local open-weight language model experiments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3", "transformers>=5.17,<6", "huggingface-hub>=1.29,<3",
  "accelerate>=1.15,<2", "safetensors>=0.4,<1", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
fine-tuning = ["peft>=0.21.1,<1"]
quantization = ["bitsandbytes>=0.50.2,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
